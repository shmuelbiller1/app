name: Quant Market Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This envelope covers both EDT and EST.
    - cron: "*/30 13-21 * * 1-5"

# IMPORTANT: Pages must be enabled once in repository settings with
# "GitHub Actions" as the build/deployment source. configure-pages cannot
# discover a Pages site that has never been enabled, which is the failure seen
# in run 33781850574.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quant-scanner
  cancel-in-progress: false

env:
  ALERT_MIN_SCORE: "85"
  ALERT_SCORE_CHANGE: "5"
  ALERT_COOLDOWN_SECONDS: "14400"
  ALERT_DASHBOARD_URL: ${{ vars.ALERT_DASHBOARD_URL }}

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      - name: Verify scanner package imports
        run: |
          python -c "import scanner; import scanner.run_scanner; import scanner.research_stats; import scanner.signal_lab; import scanner.finra_client; print('scanner package imports OK')"

      - name: Check U.S. regular market session
        id: session
        run: python scanner/session_gate.py

      - name: Outside regular session
        if: steps.session.outputs.in_session != 'true'
        run: echo "Outside America/New_York regular session — no market scan, alerts, commit, or dashboard deploy."

      - name: Optional FINRA enrichment
        if: steps.session.outputs.in_session == 'true'
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: |
          rm -f data/finra_short_interest.csv data/finra_reg_sho_daily.csv
          if [ -n "$FINRA_CLIENT_ID" ] && [ -n "$FINRA_CLIENT_SECRET" ]; then
            python -c "from scanner.finra_client import run_finra_ingest; print(run_finra_ingest())"
          else
            echo "FINRA credentials not configured — continuing in ZERO-KEY MODE"
          fi

      - name: Run LIVE zero-key-first scanner
        if: steps.session.outputs.in_session == 'true'
        env:
          FINRA_SHORT_CSV: data/finra_short_interest.csv
          FINRA_REG_SHO_CSV: data/finra_reg_sho_daily.csv
          ALLOW_UNKNOWN_INDUSTRY: "1"
        run: python -m scanner.hardened_runner

      - name: Send stateful email alerts
        if: steps.session.outputs.in_session == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m scanner.smart_alerts

      - name: Commit fresh scan data and research inputs
        if: steps.session.outputs.in_session == 'true'
        run: |
          git config user.name "quant-scanner[bot]"
          git config user.email "quant-scanner[bot]@users.noreply.github.com"
          git add -A frontend/public/scanner-data.json frontend/public/signal-lab.json data/finra_short_interest.csv data/finra_reg_sho_daily.csv data/signal_lab.sqlite3 data/alert_state.json
          git diff --cached --quiet || git commit -m "chore: refresh live scanner data"
          git push

      - name: Node
        if: steps.session.outputs.in_session == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build dashboard
        if: steps.session.outputs.in_session == 'true'
        working-directory: frontend
        run: |
          yarn install --non-interactive
          yarn build

      - name: Configure Pages
        if: steps.session.outputs.in_session == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.session.outputs.in_session == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        if: steps.session.outputs.in_session == 'true'
        uses: actions/deploy-pages@v5
