name: Quant Market Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Cover both EST and EDT with a wider window;
    # the Python scanner itself enforces 09:30–16:00 America/New_York.
    - cron: "*/30 13-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quant-scanner
  cancel-in-progress: true

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      - name: Optional FINRA enrichment
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: |
          if [ -n "$FINRA_CLIENT_ID" ] && [ -n "$FINRA_CLIENT_SECRET" ]; then
            python -c "from scanner.finra_client import run_finra_ingest; print(run_finra_ingest())"
          else
            echo "FINRA credentials not configured — continuing in ZERO-KEY MODE"
          fi

      - name: Run LIVE zero-key-first scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINRA_SHORT_CSV: data/finra_short_interest.csv
          ALERT_MIN_SCORE: "85"
        run: python scanner/run_scanner.py

      - name: Commit fresh scan data and research inputs
        run: |
          git config user.name "quant-scanner[bot]"
          git config user.email "quant-scanner[bot]@users.noreply.github.com"
          git add frontend/public/scanner-data.json frontend/public/signal-lab.json data/finra_short_interest.csv data/finra_reg_sho_daily.csv data/signal_lab.sqlite3
          git diff --cached --quiet || git commit -m "chore: refresh live scanner data"
          git push

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Build dashboard
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
