name: Quant Market Scanner

on:
  workflow_dispatch:
  schedule:
    # Broad UTC envelope; session_gate.py applies the actual 09:30–16:00
    # America/New_York regular-session boundary and handles DST correctly.
    - cron: "*/30 13-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quant-scanner
  cancel-in-progress: true

env:
  ALERT_MIN_SCORE: "85"
  ALERT_SCORE_CHANGE: "5"
  ALERT_COOLDOWN_SECONDS: "14400"
  ALERT_DASHBOARD_URL: ${{ vars.ALERT_DASHBOARD_URL }}

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      - name: Check U.S. regular market session
        id: session
        run: python scanner/session_gate.py

      - name: Optional FINRA enrichment
        if: steps.session.outputs.in_session == 'true'
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: |
          if [ -n "$FINRA_CLIENT_ID" ] && [ -n "$FINRA_CLIENT_SECRET" ]; then
            python -c "from scanner.finra_client import run_finra_ingest; print(run_finra_ingest())"
          else
            echo "FINRA credentials not configured — continuing in ZERO-KEY MODE"
          fi

      - name: Run LIVE zero-key-first scanner
        if: steps.session.outputs.in_session == 'true'
        env:
          FINRA_SHORT_CSV: data/finra_short_interest.csv
          FINRA_REG_SHO_CSV: data/finra_reg_sho_daily.csv
          ALLOW_UNKNOWN_INDUSTRY: "1"
        run: python scanner/hardened_runner.py

      - name: Send stateful email alerts
        if: steps.session.outputs.in_session == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scanner/smart_alerts.py

      - name: Commit fresh scan data and research inputs
        if: steps.session.outputs.in_session == 'true'
        run: |
          git config user.name "quant-scanner[bot]"
          git config user.email "quant-scanner[bot]@users.noreply.github.com"
          git add frontend/public/scanner-data.json frontend/public/signal-lab.json data/finra_short_interest.csv data/finra_reg_sho_daily.csv data/signal_lab.sqlite3 data/alert_state.json
          git diff --cached --quiet || git commit -m "chore: refresh live scanner data"
          git push

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Build dashboard
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
